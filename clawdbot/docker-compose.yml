services:

  clawdbot-gateway:
    image: clawdbot:local   # image du Dockerfile
    env_file: .env
    volumes:
      - "clawdbot-config:/home/node/.clawdbot"
      - "clawdbot-workspace:/home/node/clawd"
    command: >
      clawdbot gateway
      --config /home/node/.clawdbot/config.yaml
      --port 18789

  clawdbot-cli:
    image: clawdbot:local
    env_file: .env
    entrypoint: ["docker-entrypoint.sh"]
    command: ["clawdbot", "cli"]
    volumes:
      - "clawdbot-config:/home/node/.clawdbot"
      - "clawdbot-workspace:/home/node/clawd"

volumes:
  clawdbot-config:
  clawdbot-workspace:
